<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayMySongs - Cadastrar Música</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/uploadController.js"></script>
</head>

<body onload="carregarEstilos()">
    <div class="container mt-4">
        <h2>Cadastrar Música</h2>
        <a href="index.html" class="btn btn-link mb-3">← Voltar para a Home</a>

        <form id="formUpload" onsubmit="enviarMusica(event)">
            <div class="mb-3">
                <label for="titulo" class="form-label">Nome da Música</label>
                <input type="text" class="form-control" id="titulo" required>
            </div>

            <div class="mb-3">
                <label for="artista" class="form-label">Nome do Artista / Banda</label>
                <input type="text" class="form-control" id="artista" required>
            </div>

            <div class="mb-3">
                <label for="estilo" class="form-label">Estilo</label>
                <select class="form-select" id="estilo" required>
                    <option value="">A carregar estilos...</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="file" class="form-label">Ficheiro de Áudio (.mp3 ou .ogg)</label>
                <input type="file" class="form-control" id="file" accept=".mp3,.ogg" required>
            </div>

            <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>

        <div id="mensagem" class="mt-3"></div>
    </div>
</body>

</html>
